<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Actualizacion de tu orden</title>
</head>
<body style="font-family: Arial, sans-serif; padding: 20px;">
  <h2>Actualizacion de tu orden</h2>
  <p>Hola {{ToName}},</p>
  <p>Tu orden <strong>#{{OrderNumber}}</strong> ha cambiado de estado:</p>
  <p><strong>{{OldStatus}}</strong> &rarr; <strong>{{NewStatus}}</strong></p>
  <p>Total de la orden: ${{Total}}</p>
</body>
</html>
